apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 为所有资源添加公共前缀
namePrefix: dev-

# 为所有资源设置命名空间
namespace: default

# 为所有资源添加公共标签和注解
labels:
- includeSelectors: true
  pairs:
    env: dev
    managed-by: kustomize

commonAnnotations:
  note: generated by kustomize

# 引用的资源文件
resources:
- pod.yaml

# 镜像替换示例：将原镜像替换为新版本
images:
- name: nginx
  newName: m.daocloud.io/docker.io/library/nginx
  newTag: "1.27"

# 通过 patch 覆盖 Pod 环境变量值
# 修改下方 value 即可切换环境，无需改动 pod.yaml
patches:
- patch: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: my-pod
    spec:
      containers:
      - name: nginx
        env:
        - name: env
          value: dev
        - name: databaseURL
          value: mysql://dev-db:3306/myapp
  target:
    kind: Pod
    name: my-pod
