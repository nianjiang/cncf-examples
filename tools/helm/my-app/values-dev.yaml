# Dev 环境值 — 对应 kustomize overlays/dev
# 使用方式: helm install org-myapp-dev . -f values-dev.yaml -n default

# Dev 环境使用国内镜像源加速
image:
  repository: m.daocloud.io/docker.io/library/nginx
  tag: "1.31"

# Dev 环境变量
env:
  env: dev
  databaseURL: mysql://dev-db:3306/myapp

# Dev 环境标签
envName: dev
labels:
  managed-by: helm
  env: dev
