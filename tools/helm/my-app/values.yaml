# 默认值 — 对应 kustomize base 配置
# 环境特定值通过 -f values-<env>.yaml 覆盖

# 名称覆盖（可选）
fullnameOverride: "helm-test"    # 完全覆盖资源名称，忽略 release name
# nameOverride: ""               # 替换 chart name 部分

# Deployment 配置
replicaCount: 1

image:
  repository: nginx
  tag: "1.25"
  pullPolicy: IfNotPresent

# 环境变量
env:
  env: env-name
  databaseURL: DatabaseURL

# 资源限制 — 对应 kustomize base 默认值
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Service 配置
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# 公共标签和注解 — 对应 kustomize commonLabels / commonAnnotations
labels:
  managed-by: helm

annotations:
  note: generated by helm

# 环境标识（由 values-<env>.yaml 覆盖）
envName: ""
